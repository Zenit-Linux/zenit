name: Build ISO

# v0.4 -- NAPRAWIONE pomylenie plikow: ten workflow historycznie nazywal
# sie "build-oci.yml", mimo ze jego kroki od zawsze budowaly bootowalne
# ISO (zlb build iso), a plik "build-iso.yml" budowal OCI. Nazwy plikow
# zostaly zamienione miejscami tak, zeby odpowiadaly rzeczywistej tresci
# -- patrz build-oci.yml (teraz faktycznie buduje OCI, backend "atomic - oci").
#
# UWAGA: nowe .github/workflows/menu.yml (v0.4) NIE oferuje juz "iso" jako
# osobnej pozycji do wyboru -- zgodnie z aktualnym wymaganiem menu ma tylko
# "atomic - oci", "atomic - fasttree (placeholder)", "standard", "container"
# i "all". Ten workflow zostaje jednak w repo bez zmian funkcjonalnych:
# nadal buduje sie automatycznie przy pushu taga (`v*`) i nadal mozna go
# uruchomic recznie z zakladki Actions (workflow_dispatch), po prostu nie
# jest juz jednym z przyciskow w build menu.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arch:
        description: "Architektura (puste = wszystkie z distro.hcl)"
        required: false
        default: ""
      zlb_source:
        description: "Skad wziac zlb: latest-release | version | source"
        required: false
        type: choice
        default: "latest-release"
        options:
          - latest-release
          - version
          - source
      zlb_version:
        description: "Konkretna wersja zlb (np. v0.1) -- tylko gdy zlb_source=version"
        required: false
        default: ""

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      # NAPRAWIONE: 'needrestart' na obrazie ubuntu-latest (noble) potrafi po
      # apt-get install wyskoczyc z INTERAKTYWNYM oknem "ktore uslugi
      # zrestartowac?" i czekac na Enter, ktorego nikt nie nacisnie w CI --
      # job wtedy wisi w nieskonczonosc zamiast zakonczyc sie bledem. Te dwie
      # zmienne wylaczaja wszystkie interaktywne prompty apt/debconf/needrestart
      # dla KAZDEGO kroku w tym jobie (w tym krokow z .github/actions/*).
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            qemu-user-static binfmt-support gnupg tar

      - name: Install janet
        uses: ./.github/actions/install-janet

      - name: Zainstaluj zlb
        uses: ./.github/actions/install-zlb
        with:
          mode: ${{ github.event.inputs.zlb_source || 'latest-release' }}
          version: ${{ github.event.inputs.zlb_version || '' }}

      - name: Cache out/cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: zlb-cache-${{ matrix.arch }}-${{ hashFiles('distro.hcl', 'modules/**') }}
          restore-keys: zlb-cache-${{ matrix.arch }}-

      - name: Import release GPG key
        if: ${{ secrets.ZENIT_GPG_PRIVATE_KEY != '' }}
        env:
          ZENIT_GPG_PRIVATE_KEY: ${{ secrets.ZENIT_GPG_PRIVATE_KEY }}
        run: echo "$ZENIT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: zlb build rootfs
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        # sudo wymagane -- patrz komentarz przy tym samym kroku w
        # build-standard.yml ("Permission denied: /var/cache/zpm/").
        run: sudo env "PATH=$PATH" zlb build rootfs --arch ${{ matrix.arch }}

      - name: zlb build iso
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        run: sudo env "PATH=$PATH" zlb build iso --arch ${{ matrix.arch }}

      - name: Upload artifacts
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: zenit-linux-iso-${{ matrix.arch }}
          path: |
            out/*.iso
            out/*.sha256
            out/*.asc

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
            out/*.asc
