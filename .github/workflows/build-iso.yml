name: Build ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            qemu-user-static binfmt-support gnupg tar

      - name: Install janet
        run: |
          sudo apt-get install -y janet || (curl -fsSL https://janet-lang.org/install.sh | sudo bash)

      - name: Install zlb
        run: |
          curl -fsSL https://github.com/Zenith-Linux/zlb/releases/latest/download/zlb-linux-x86_64 -o /usr/local/bin/zlb
          chmod +x /usr/local/bin/zlb

      - name: Cache out/cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: zlb-cache-${{ matrix.arch }}-${{ hashFiles('distro.hcl', 'modules/**') }}
          restore-keys: zlb-cache-${{ matrix.arch }}-

      - name: Import release GPG key
        if: ${{ secrets.ZENITH_GPG_PRIVATE_KEY != '' }}
        env:
          ZENITH_GPG_PRIVATE_KEY: ${{ secrets.ZENITH_GPG_PRIVATE_KEY }}
        run: echo "$ZENITH_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: zlb build rootfs
        run: zlb build rootfs --arch ${{ matrix.arch }}

      - name: zlb build iso
        run: zlb build iso --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenith-linux-iso-${{ matrix.arch }}
          path: |
            out/*.iso
            out/*.sha256
            out/*.asc

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
            out/*.asc
