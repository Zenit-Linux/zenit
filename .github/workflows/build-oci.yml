name: Build OCI image (atomic - oci)

# v0.4 -- NAPRAWIONE pomylenie plikow: ten workflow historycznie nazywal
# sie "build-iso.yml", mimo ze jego kroki od zawsze budowaly obraz OCI
# (zlb build oci), a plik "build-oci.yml" budowal ISO. Nazwy plikow zostaly
# zamienione miejscami tak, zeby odpowiadaly rzeczywistej tresci -- patrz
# build-iso.yml (teraz faktycznie buduje ISO).
#
# To jest backend "atomic - oci" z .github/workflows/menu.yml: system
# atomic/immutable budowany jako warstwa OCI (docelowo montowana/bootowana
# w sposob niemutowalny, w odroznieniu od "standard", ktory jest zwyklym,
# nieimmutable rootfs -- patrz build-standard.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arch:
        description: "Architektura (puste = wszystkie z distro.hcl)"
        required: false
        default: ""
      zlb_source:
        description: "Skad wziac zlb: latest-release | version | source"
        required: false
        type: choice
        default: "latest-release"
        options:
          - latest-release
          - version
          - source
      zlb_version:
        description: "Konkretna wersja zlb (np. v0.1) -- tylko gdy zlb_source=version"
        required: false
        default: ""

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      # NAPRAWIONE: 'needrestart' na obrazie ubuntu-latest (noble) potrafi po
      # apt-get install wyskoczyc z INTERAKTYWNYM oknem "ktore uslugi
      # zrestartowac?" i czekac na Enter, ktorego nikt nie nacisnie w CI --
      # job wtedy wisi w nieskonczonosc zamiast zakonczyc sie bledem. Te dwie
      # zmienne wylaczaja wszystkie interaktywne prompty apt/debconf/needrestart
      # dla KAZDEGO kroku w tym jobie (w tym krokow z .github/actions/*).
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools qemu-user-static binfmt-support gnupg tar skopeo

      - name: Install janet
        uses: ./.github/actions/install-janet

      - name: Zainstaluj zlb
        uses: ./.github/actions/install-zlb
        with:
          mode: ${{ github.event.inputs.zlb_source || 'latest-release' }}
          version: ${{ github.event.inputs.zlb_version || '' }}

      - name: Cache out/cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: zlb-cache-${{ matrix.arch }}-${{ hashFiles('distro.hcl', 'modules/**') }}
          restore-keys: zlb-cache-${{ matrix.arch }}-

      - name: zlb build rootfs
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        # sudo wymagane -- patrz komentarz przy tym samym kroku w
        # build-standard.yml ("Permission denied: /var/cache/zpm/").
        run: sudo env "PATH=$PATH" zlb build rootfs --arch ${{ matrix.arch }}

      - name: zlb build oci
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        run: sudo env "PATH=$PATH" zlb build oci --arch ${{ matrix.arch }}

      - name: Log in to registry
        if: ${{ secrets.REGISTRY_TOKEN != '' && (github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch) }}
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | skopeo login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Push OCI image
        if: ${{ secrets.REGISTRY_TOKEN != '' && (github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch) }}
        run: |
          for d in out/oci/*/; do
            skopeo copy "oci:${d%/}" "docker://ghcr.io/zenit-linux/zenit-linux:${{ matrix.arch }}-${{ github.ref_name }}"
          done

      - name: Upload artifacts
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: zenit-linux-oci-${{ matrix.arch }}
          path: out/oci/**
