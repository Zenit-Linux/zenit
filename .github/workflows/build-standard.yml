name: Build standard rootfs

# "standard" w .github/workflows/menu.yml -- zwykly system (NIE
# atomic/immutable): zlb build rootfs spakowany jako tar.xz. Backend
# "atomic - oci" (build-oci.yml) i przyszly "atomic - fasttree"
# (build-atomic-fasttree.yml) to odrebne, niemutowalne warianty.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      arch:
        description: "Architektura (puste = wszystkie z distro.hcl)"
        required: false
        default: ""
      zlb_source:
        description: "Skad wziac zlb: latest-release | version | source"
        required: false
        type: choice
        default: "latest-release"
        options:
          - latest-release
          - version
          - source
      zlb_version:
        description: "Konkretna wersja zlb (np. v0.1) -- tylko gdy zlb_source=version"
        required: false
        default: ""

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools qemu-user-static binfmt-support gnupg tar

      - name: Install janet
        run: |
          sudo apt-get install -y janet || (curl -fsSL https://janet-lang.org/install.sh | sudo bash)

      - name: Zainstaluj zlb
        uses: ./.github/actions/install-zlb
        with:
          mode: ${{ github.event.inputs.zlb_source || 'latest-release' }}
          version: ${{ github.event.inputs.zlb_version || '' }}

      - name: Cache out/cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: zlb-cache-${{ matrix.arch }}-${{ hashFiles('distro.hcl', 'modules/**') }}
          restore-keys: zlb-cache-${{ matrix.arch }}-

      - name: zlb build rootfs
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        run: zlb build rootfs --arch ${{ matrix.arch }}

      - name: Package rootfs tarball
        if: ${{ github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch }}
        run: |
          mkdir -p out
          tar -C out/cache/rootfs/${{ matrix.arch }} -cJf out/zenit-linux-standard-${{ matrix.arch }}.tar.xz .
          sha256sum out/zenit-linux-standard-${{ matrix.arch }}.tar.xz > out/zenit-linux-standard-${{ matrix.arch }}.tar.xz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenit-linux-standard-${{ matrix.arch }}
          path: |
            out/zenit-linux-standard-${{ matrix.arch }}.tar.xz
            out/zenit-linux-standard-${{ matrix.arch }}.tar.xz.sha256
