name: Build headless devcontainer (OCI)

# v0.3 -- "rozbuduj mi w archwium .zip dla zenit o nowy workflow ktory
# bedzie budowac do kontenera dla podman bez srodowiska graficznego sam
# system dla devow czy cos wiadomo cos jak ta fedora z podmanie" (cytat
# z wymagań). Odpowiednik "fedora toolbox"/silverblue devcontainer dla
# Zenit Linux: obraz OCI z narzędziami deweloperskimi (git, kompilator,
# neovim, podman-w-podman, itd.), BEZ środowiska graficznego, BEZ
# jądra/bootloadera/instalatora -- to warstwa aplikacyjna do
# `podman run`/`podman create --name dev ...`, nie bootowalny system.
#
# Buduje z ALTERNATYWNEGO manifestu `devcontainer.hcl` (nie distro.hcl)
# przez nową flagę `zlb build oci --manifest=devcontainer.hcl` (v0.3) --
# patrz devcontainer.hcl i modules/devcontainer/package.list w tym repo.
#
# v0.4 -- to jest backend pozycji "container" w .github/workflows/menu.yml.
# Dodano wybór architektury i źródła narzędzia zlb (spójnie z resztą
# workflow'ów) oraz USUNIĘTO martwy krok "Zainstaluj Nim": ten krok nie
# był tu do niczego potrzebny -- zlb było i tak pobierane jako gotowa
# binarka (nie budowane ze źródeł), a Nim/nimble jest potrzebny WYŁĄCZNIE
# gdy zlb_source="source" (patrz .github/actions/install-zlb, który sam
# doinstalowuje Nim tylko w tym trybie).

on:
  push:
    branches: [main]
    paths:
      - "devcontainer.hcl"
      - "modules/devcontainer/**"
      - ".github/workflows/build-devcontainer.yml"
  workflow_dispatch:
    inputs:
      arch:
        description: "Architektura (puste = x86_64)"
        required: false
        default: ""
      zlb_source:
        description: "Skad wziac zlb: latest-release | version | source"
        required: false
        type: choice
        default: "latest-release"
        options:
          - latest-release
          - version
          - source
      zlb_version:
        description: "Konkretna wersja zlb (np. v0.1) -- tylko gdy zlb_source=version"
        required: false
        default: ""
  schedule:
    # Cotygodniowy rebuild -- świeże pakiety apt/cargo bez czekania na
    # ręczny trigger (devcontainery są używane codziennie przez devów,
    # więc "świeżość" ma tu większe znaczenie niż dla ISO wydawanych
    # rzadziej).
    - cron: "0 4 * * 1"

jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # NAPRAWIONE: 'needrestart' na obrazie ubuntu-latest (noble) potrafi po
      # apt-get install wyskoczyc z INTERAKTYWNYM oknem "ktore uslugi
      # zrestartowac?" i czekac na Enter, ktorego nikt nie nacisnie w CI --
      # job wtedy wisi w nieskonczonosc zamiast zakonczyc sie bledem. Te dwie
      # zmienne wylaczaja wszystkie interaktywne prompty apt/debconf/needrestart
      # dla KAZDEGO kroku w tym jobie (w tym krokow z .github/actions/*).
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe budowania rootfs/OCI
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap skopeo podman

      - name: Zainstaluj Janet (wymagany do hookow modulow)
        uses: ./.github/actions/install-janet

      - name: Zainstaluj zlb
        uses: ./.github/actions/install-zlb
        with:
          mode: ${{ github.event.inputs.zlb_source || 'latest-release' }}
          version: ${{ github.event.inputs.zlb_version || '' }}

      - name: Waliduj devcontainer.hcl / package.list
        run: zlb validate --manifest=devcontainer.hcl

      - name: Buduj obraz OCI (headless devcontainer)
        run: zlb build oci --manifest=devcontainer.hcl --arch ${{ github.event.inputs.arch || 'x86_64' }}

      - name: Zaloguj do ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publikuj do ghcr.io/zenit-linux/zenit-linux-devcontainer
        if: github.event_name != 'pull_request'
        run: |
          set -e
          OCI_DIR=$(find out/oci -maxdepth 1 -type d | tail -1)
          skopeo copy "oci:${OCI_DIR}" "docker://ghcr.io/zenit-linux/zenit-linux-devcontainer:latest"
          skopeo copy "oci:${OCI_DIR}" "docker://ghcr.io/zenit-linux/zenit-linux-devcontainer:$(date +%Y%m%d)"

      - name: Sanity-check (uruchom kontener, sprawdź podstawowe narzędzia)
        run: |
          podman run --rm ghcr.io/zenit-linux/zenit-linux-devcontainer:latest \
            sh -c 'git --version && zpm --version && podman --version' || true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        with:
          name: zenit-devcontainer-oci
          path: out/oci/
