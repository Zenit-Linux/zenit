name: Build menu

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Co zbudować?"
        required: true
        type: choice
        default: "atomic - oci"
        options:
          - "atomic - oci"
          - "atomic - fasttree (placeholder)"
          - "standard (nieimmutable)"
          - "container"
          - "all"
      arch:
        description: "Architektura"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "x86_64"
          - "aarch64"
      zlb_source:
        description: "Skąd wziąć narzędzie zlb?"
        required: true
        type: choice
        default: "najnowsza wersja (GitHub Releases)"
        options:
          - "najnowsza wersja (GitHub Releases)"
          - "konkretna wersja (GitHub Releases)"
          - "budowanie ze źródeł (git clone + janet build.janet)"
      zlb_version:
        description: >-
          Konkretna wersja zlb (np. v0.1) -- używane TYLKO gdy zlb_source =
          "konkretna wersja (GitHub Releases)"
        required: false
        default: ""

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj wybrane workflow'y
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.payload.inputs.target;
            const archChoice = context.payload.inputs.arch || "all";
            const zlbSourceChoice = context.payload.inputs.zlb_source || "najnowsza wersja (GitHub Releases)";
            const zlbVersion = context.payload.inputs.zlb_version || "";

            // "atomic - oci"      -> zlb build oci (system atomic/immutable, warstwa OCI)
            // "atomic - fasttree" -> placeholder, zlb nie ma jeszcze tego backendu
            // "standard"          -> zlb build rootfs (zwykły system, NIE immutable)
            // "container"         -> devcontainer OCI (bez środowiska graficznego, dla devów)
            const workflows = {
              "atomic - oci": ["build-oci.yml"],
              "atomic - fasttree (placeholder)": ["build-atomic-fasttree.yml"],
              "standard (nieimmutable)": ["build-standard.yml"],
              "container": ["build-devcontainer.yml"],
            };

            const toRun = target === "all"
              ? Object.values(workflows).flat()
              : workflows[target];

            if (!toRun) {
              core.setFailed(`Nieznany target: ${target}`);
              return;
            }

            // Mapowanie ładnych etykiet z menu na krótkie wartości, które
            // rozumie composite action .github/actions/install-zlb (mode).
            const zlbSourceMap = {
              "najnowsza wersja (GitHub Releases)": "latest-release",
              "konkretna wersja (GitHub Releases)": "version",
              "budowanie ze źródeł (git clone + janet build.janet)": "source",
            };
            const zlbSource = zlbSourceMap[zlbSourceChoice] || "latest-release";

            if (zlbSource === "version" && !zlbVersion) {
              core.setFailed('zlb_source = "konkretna wersja" wymaga podania zlb_version (np. v0.1)');
              return;
            }

            // "all" oznacza "wszystkie architektury z distro.hcl" -- w
            // workflowach docelowych puste arch == wszystkie (tak jak dotąd).
            const arch = archChoice === "all" ? "" : archChoice;

            for (const wf of toRun) {
              console.log(`Uruchamiam ${wf} (arch=${archChoice}, zlb_source=${zlbSource}, zlb_version=${zlbVersion || "-"})`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: context.ref,
                inputs: {
                  arch,
                  zlb_source: zlbSource,
                  zlb_version: zlbVersion,
                },
              });
            }
