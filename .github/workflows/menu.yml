name: Build menu

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Co zbudować?"
        required: true
        type: choice
        default: "atomic - oci"
        options:
          - "atomic - oci"
          - "atomic - fasttree (placeholder)"
          - "standard (nieimmutable)"
          - "container"
          - "all"
      arch:
        description: "Architektura"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "x86_64"
          - "aarch64"
      zlb_source:
        description: "Skąd wziąć narzędzie zlb?"
        required: true
        type: choice
        default: "najnowsza wersja (GitHub Releases)"
        options:
          - "najnowsza wersja (GitHub Releases)"
          - "konkretna wersja (GitHub Releases)"
          - "budowanie ze źródeł (git clone + janet build.janet)"
      zlb_version:
        description: >-
          Konkretna wersja zlb (np. v0.1) -- używane TYLKO gdy zlb_source =
          "konkretna wersja (GitHub Releases)"
        required: false
        default: ""

permissions:
  # Domyslny GITHUB_TOKEN dostaje tylko contents/metadata/packages: read
  # (patrz log builda: "GITHUB_TOKEN Permissions: Contents: read,
  # Metadata: read, Packages: read"), a createWorkflowDispatch z REST API
  # wymaga jawnie 'actions: write' -- bez tego bloku call konczyl sie
  # 403 "Resource not accessible by integration" dla KAZDEGO workflow_id,
  # jeszcze zanim doszlo do sprawdzania, czy plik istnieje.
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj wybrane workflow'y
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.payload.inputs.target;
            const archChoice = context.payload.inputs.arch || "all";
            const zlbSourceChoice = context.payload.inputs.zlb_source || "najnowsza wersja (GitHub Releases)";
            const zlbVersion = context.payload.inputs.zlb_version || "";

            // "atomic - oci"      -> zlb build oci (system atomic/immutable, warstwa OCI)
            // "atomic - fasttree" -> placeholder, zlb nie ma jeszcze tego backendu
            // "standard"          -> zlb build rootfs (zwykły system, NIE immutable)
            // "container"         -> devcontainer OCI (bez środowiska graficznego, dla devów)
            const workflows = {
              "atomic - oci": ["build-oci.yml"],
              "atomic - fasttree (placeholder)": ["build-atomic-fasttree.yml"],
              "standard (nieimmutable)": ["build-standard.yml"],
              "container": ["build-devcontainer.yml"],
            };

            const toRun = target === "all"
              ? Object.values(workflows).flat()
              : workflows[target];

            if (!toRun) {
              core.setFailed(`Nieznany target: ${target}`);
              return;
            }

            // Mapowanie ładnych etykiet z menu na krótkie wartości, które
            // rozumie composite action .github/actions/install-zlb (mode).
            const zlbSourceMap = {
              "najnowsza wersja (GitHub Releases)": "latest-release",
              "konkretna wersja (GitHub Releases)": "version",
              "budowanie ze źródeł (git clone + janet build.janet)": "source",
            };
            const zlbSource = zlbSourceMap[zlbSourceChoice] || "latest-release";

            if (zlbSource === "version" && !zlbVersion) {
              core.setFailed('zlb_source = "konkretna wersja" wymaga podania zlb_version (np. v0.1)');
              return;
            }

            // "all" oznacza "wszystkie architektury z distro.hcl" -- w
            // workflowach docelowych puste arch == wszystkie (tak jak dotąd).
            const arch = archChoice === "all" ? "" : archChoice;

            // Pomocnicza funkcja: usypia na ms milisekund (github-script
            // nie ma wbudowanego sleep -- Node'owy setTimeout w Promise).
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            for (const wf of toRun) {
              // GitHub automatycznie wylacza workflow po ~60 dniach braku
              // aktywnosci w repo (albo ktos wylaczyl go recznie w zakladce
              // Actions) -- wtedy createWorkflowDispatch konczy sie 422
              // "Cannot trigger a 'workflow_dispatch' on a disabled workflow".
              // Zamiast wymagac recznego kliku "Enable workflow" za kazdym
              // razem, probujemy najpierw jawnie go wlaczyc -- enableWorkflow
              // jest idempotentny (no-op, jesli juz jest wlaczony), wiec nie
              // szkodzi wywolywac go zawsze.
              let wasDisabled = false;
              try {
                const { data: wfInfoBefore } = await github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                });
                wasDisabled = wfInfoBefore.state !== "active";
                if (wasDisabled) {
                  await github.rest.actions.enableWorkflow({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: wf,
                  });
                }
              } catch (e) {
                console.log(`Nie udalo sie sprawdzic/wlaczyc ${wf}: ${e.message}`);
              }

              // NAPRAWIONE: enableWorkflow jest "eventually consistent" --
              // odpalenie createWorkflowDispatch od razu po nim potrafi
              // stworzyc run, ktory na zawsze utyka w statusie "Queued"
              // (GitHub jeszcze nie "dogonil" wewnetrznie informacji, ze
              // workflow jest juz aktywny). Zamiast na slepo czekac, po
              // wlaczeniu odpytujemy getWorkflow w petli, az faktycznie
              // potwierdzi state=="active" (max 5 prob co 2s), i dopiero
              // wtedy robimy dispatch. Jesli workflow i tak juz byl
              // aktywny, ten krok w ogole sie nie wykonuje (zero opoznienia).
              if (wasDisabled) {
                let active = false;
                for (let i = 0; i < 5 && !active; i++) {
                  await sleep(2000);
                  try {
                    const { data: wfInfo } = await github.rest.actions.getWorkflow({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      workflow_id: wf,
                    });
                    active = wfInfo.state === "active";
                  } catch (e) {
                    console.log(`Sprawdzanie stanu ${wf} nie powiodlo sie: ${e.message}`);
                  }
                }
                if (!active) {
                  console.log(`::warning::${wf} nie potwierdzil stanu 'active' po 5 probach -- dispatch i tak probuje, ale run moze utknac w 'Queued'.`);
                }
              }

              console.log(`Uruchamiam ${wf} (arch=${archChoice}, zlb_source=${zlbSource}, zlb_version=${zlbVersion || "-"})`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: context.ref,
                inputs: {
                  arch,
                  zlb_source: zlbSource,
                  zlb_version: zlbVersion,
                },
              });
            }
