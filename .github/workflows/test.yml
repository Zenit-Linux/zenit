name: Smoke test build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      zlb_source:
        description: "Skad wziac zlb: latest-release | version | source"
        required: false
        type: choice
        default: "latest-release"
        options:
          - latest-release
          - version
          - source
      zlb_version:
        description: "Konkretna wersja zlb (np. v0.1) -- tylko gdy zlb_source=version"
        required: false
        default: ""

jobs:
  rootfs-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools qemu-user-static binfmt-support gnupg tar

      - name: Install janet
        run: |
          sudo apt-get install -y janet || (curl -fsSL https://janet-lang.org/install.sh | sudo bash)

      - name: Zainstaluj zlb
        uses: ./.github/actions/install-zlb
        with:
          mode: ${{ github.event.inputs.zlb_source || 'latest-release' }}
          version: ${{ github.event.inputs.zlb_version || '' }}

      - name: Cache out/cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: zlb-cache-x86_64-${{ hashFiles('distro.hcl', 'modules/**') }}
          restore-keys: zlb-cache-x86_64-

      - name: zlb build rootfs (smoke test)
        run: zlb build rootfs --arch x86_64

      - name: Sanity-check rootfs contents
        run: |
          test -f out/cache/rootfs/x86_64/etc/os-release
          test -x out/cache/rootfs/x86_64/usr/local/bin/installer || echo "installer nie osadzony (auto_fetch=false?) -- ok w smoke teście"
